name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-verify:
    name: Build Solution & Packaging Pipelines
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Setup .NET SDK"
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: "Build Tapster Solution (Release)"
        shell: pwsh
        run: |
          dotnet build Tapster.sln -c Release

      - name: "Run Unit Tests"
        shell: pwsh
        run: |
          dotnet test Tapster.sln --no-build -c Release --logger "console;verbosity=normal"

      - name: "Test Portable Single-File Packaging"
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build_portable.ps1
          if (-not (Test-Path "publish/Tapster.exe")) {
            throw "Missing expected output: publish/Tapster.exe"
          }
          Write-Host "Portable build verified: publish/Tapster.exe ($((Get-Item publish/Tapster.exe).Length / 1MB) MB)"

      - name: "Test Store MSIX Packaging"
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build_msix.ps1
          $msix = Get-ChildItem "publish/*.msix" | Select-Object -First 1
          if ($null -eq $msix) {
            throw "Missing expected MSIX package in publish/"
          }
          Write-Host "MSIX build verified: $($msix.FullName) ($($msix.Length / 1MB) MB)"

      - name: "Shutdown Build Servers (Process Hygiene)"
        shell: pwsh
        if: always()
        run: |
          dotnet build-server shutdown
