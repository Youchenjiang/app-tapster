name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "30 1 * * 6" # Every Saturday at 01:30 UTC
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Default deny-all; the job below overrides with exactly the permissions it needs
permissions: {}  # deny-all by default; job-level overrides below

jobs:
  analysis:
    name: Scorecard Security Analysis
    runs-on: ubuntu-latest
    permissions:
      # Required to upload the results to the GitHub Security tab
      security-events: write
      # Required to sign the results for OpenSSF badge publication
      id-token: write

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: "Run OpenSSF Scorecard Analysis"
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Public repository can publish results to OpenSSF REST API for badge generation
          publish_results: true

      - name: "Upload SARIF Results to GitHub Security Code Scanning"
        uses: github/codeql-action/upload-sarif@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.10
        with:
          sarif_file: results.sarif
