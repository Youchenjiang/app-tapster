# ==============================================================================
# 📦 CycloneDX Software Bill of Materials (SBOM)
#
# 【生命週期】
# PR Gate / Artifact-only：PR 階段只產生並保存 SBOM Artifact，不將 PR 資料送往外部平台。
# Post-Merge：main / master Push 時才在已配置的情況下上傳正式 SBOM 至 Dependency-Track。
#
# 【功能說明】
# 使用 Anchore Syft 掃描專案相依元件並產生 CycloneDX JSON SBOM。
# SBOM 會保留為 GitHub Actions Artifact，供稽核、Dependency-Track、
# DefectDojo 或其他供應鏈安全工具後續使用。
#
# 【觸發方式】
# 1. 推送至 main / master。
# 2. 對 main / master 發起或更新 Pull Request。
# 3. 支援 workflow_dispatch 手動執行。
# ==============================================================================

name: CycloneDX SBOM

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    env:
      DTRACK_URL: ${{ vars.DTRACK_URL }}
      DTRACK_PROJECT_UUID: ${{ vars.DTRACK_PROJECT_UUID }}
      DTRACK_PROJECT_NAME: ${{ vars.DTRACK_PROJECT_NAME }}
      DTRACK_PROJECT_VERSION: ${{ vars.DTRACK_PROJECT_VERSION }}
      DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate CycloneDX JSON SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx-json
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload SBOM to Dependency-Track
        if: ${{ github.event_name != 'pull_request' && env.DTRACK_URL != '' && env.DTRACK_API_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail

          api_url="${DTRACK_URL%/}/api/v1/bom"

          if [[ -n "${DTRACK_PROJECT_UUID:-}" ]]; then
            curl --fail-with-body --silent --show-error --retry 3 \
              --request POST "${api_url}" \
              --header "X-Api-Key: ${DTRACK_API_KEY}" \
              --form "project=${DTRACK_PROJECT_UUID}" \
              --form "bom=@sbom.cdx.json"
          else
            project_name="${DTRACK_PROJECT_NAME:-${GITHUB_REPOSITORY#*/}}"
            project_version="${DTRACK_PROJECT_VERSION:-${GITHUB_REF_NAME}}"

            curl --fail-with-body --silent --show-error --retry 3 \
              --request POST "${api_url}" \
              --header "X-Api-Key: ${DTRACK_API_KEY}" \
              --form "autoCreate=true" \
              --form "projectName=${project_name}" \
              --form "projectVersion=${project_version}" \
              --form "bom=@sbom.cdx.json"
          fi
