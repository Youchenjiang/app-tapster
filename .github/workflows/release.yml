name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}  # deny-all by default; job-level grants contents: write for release upload

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  release-build:
    name: Build & Package Dual-Track Releases
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write  # required to create GitHub Release and upload artifacts

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Setup .NET SDK"
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: "Build Portable Single-File EXE"
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build_portable.ps1

      - name: "Build Signed Store MSIX Package"
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build_msix.ps1

      - name: "Shutdown Build Servers"
        shell: pwsh
        if: always()
        run: |
          dotnet build-server shutdown

      - name: "Create GitHub Release and Upload Artifacts"
        uses: softprops/action-gh-release@c062e08bd5328807fb31346cf098484c1b5142c5 # v2.2.1
        with:
          files: |
            publish/Tapster.exe
            publish/*.msix
          generate_release_notes: true
          draft: false
          prerelease: false
