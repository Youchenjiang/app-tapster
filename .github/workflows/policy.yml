# ==============================================================================
# 🚦 Repository Policy & Conventional Commit Gatekeeper (PR 與提交看門狗)
#
# 【生命週期】
# PR Gate / Hard Gate：只在 Pull Request 階段執行，格式違規會直接讓檢查失敗。
#
# 【功能說明】
# 1. 嚴格驗證 PR 標題與所有 Commit Subject 是否遵循 Conventional Commits 格式：
#    `<type>(<scope>): <subject>` 或 `<type>: <subject>`
# 2. 長度限制：標頭不可超過 72 字元，且結尾不可帶句號 (`.`)。
# 3. 杜絕模糊提交：禁止使用 `update`, `misc`, `stuff`, `changes`, `fix bug` 等空洞主旨。
# 4. PR 元件檢查：自動指派作者（Author Auto-assign），提醒缺失的 Label 與 Milestone。
#
# 【分級報告機制】
# - ❌ Blocker (硬性錯誤)：格式不符、超長、帶句號、模糊字 -> 觸發 `core.setFailed()` 阻擋合併。
# - ⚠️ Warning (軟性提醒)：缺少 Label、未關聯 Milestone -> 輸出警告提醒補件，不阻擋合併。
# - 📋 Step Summary：在 GitHub Actions Summary 面板以 Markdown 表格條列檢驗結果與修復指令。
# ==============================================================================

name: Repository Policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  conventional-policy:
    name: PR and Commit Policy Validation
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Validate PR Title, Commits & Metadata
        uses: actions/github-script@v8
        with:
          script: |
            const allowedTypes = [
              "feat",
              "fix",
              "refactor",
              "docs",
              "test",
              "chore",
              "style",
              "perf",
              "security",
            ];
            const allowedScopes = [
              "core",
              "fluent",
              "launcher",
              "tray",
              "macro",
              "packaging",
              "tapster",
              "ui",
              "web",
              "cli",
              "shell",
              "msix",
              "study",
              "plan",
              "ctfd",
              "labs",
              "challenge",
              "plugin",
              "docs",
              "ci",
              "deps",
              "sec",
              "store",
              "agent",
              "infra",
              "build",
              "release",
              "governance",
              "tracks",
              "practice",
              "tools",
              "knowledge",
              "memory",
              "deepsource",
              "links",
              "scaffold",
              "automation",
            ];

            const typePattern = allowedTypes.join("|");
            const scopePattern = allowedScopes.join("|");
            const regex = new RegExp(`^(${typePattern})(?:\\((${scopePattern})\\))?: [a-z0-9].*$`);

            const blockers = [];
            const warnings = [];
            const summaryRows = [];

            function checkSubject(subject, label, maxLength = 72) {
              const text = (subject || "").trim();
              const issues = [];
              if (!regex.test(text)) {
                issues.push("Does not match `<type>(<scope>): <subject>` or `<type>: <subject>` with an allowed type/scope.");
              }
              if (text.endsWith(".")) {
                issues.push("Must not end with a trailing period (`.`).");
              }
              if (text.length > maxLength) {
                issues.push(`Length (${text.length} chars) exceeds maximum ${maxLength} chars.`);
              }
              const desc = text.replace(new RegExp(`^(${typePattern})(?:\\((${scopePattern})\\))?:\\s+`), "");
              if (/^(update|misc|stuff|changes|fix bug|bug fix)$/i.test(desc)) {
                issues.push("Description is too vague (avoid 'update', 'misc', 'fix bug').");
              }
              return issues;
            }

            // 1. Check PR Title
            const prTitle = context.payload.pull_request.title;
            const titleIssues = checkSubject(prTitle, "PR Title", 72);
            if (titleIssues.length > 0) {
              blockers.push({ target: "PR Title", text: prTitle, issues: titleIssues });
              summaryRows.push(["PR Title", `\`${prTitle}\``, "❌ Failed", titleIssues.join("<br>")]);
            } else {
              summaryRows.push(["PR Title", `\`${prTitle}\``, "✅ Passed", "-"]);
            }

            // 2. Check Commits
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            for (const c of commits) {
              const shaShort = c.sha.slice(0, 7);
              const lines = (c.commit.message || "").replace(/\r\n/g, "\n").split("\n");
              const firstLine = lines[0].trim();
              // Ignore merge or fixup commits
              if (/^(Merge|Revert|fixup!|squash!)/.test(firstLine)) {
                summaryRows.push([`Commit ${shaShort}`, `\`${firstLine}\``, "⚪ Ignored", "Merge / fixup commit"]);
                continue;
              }
              const commitIssues = checkSubject(firstLine, `Commit ${shaShort}`, 72);

              // Check body for numbered list (NCUIM parity)
              const bodyLines = lines.slice(1).filter((l) => !l.trim().startsWith("#"));
              const body = bodyLines.join("\n");
              if (!/^\s{0,3}1[.)]\s+/m.test(body)) {
                commitIssues.push("Commit body must contain a numbered list in English (e.g. `1. Explain what changed.`).");
              }

              if (commitIssues.length > 0) {
                blockers.push({ target: `Commit ${shaShort}`, text: firstLine, issues: commitIssues });
                summaryRows.push([`Commit ${shaShort}`, `\`${firstLine}\``, "❌ Failed", commitIssues.join("<br>")]);
              } else {
                summaryRows.push([`Commit ${shaShort}`, `\`${firstLine}\``, "✅ Passed", "-"]);
              }
            }

            // 3. Check Metadata (Warnings only, non-blocking)
            const pr = context.payload.pull_request;
            if (!pr.assignees || pr.assignees.length === 0) {
              try {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  assignees: [pr.user.login],
                });
              } catch (err) {
                warnings.push(`Auto-assign author failed: ${err.message}`);
              }
            }

            if (!pr.labels || pr.labels.length === 0) {
              warnings.push("No labels attached to PR. Please add a relevant scope/type label.");
            }

            // 4. Output Summary Table
            await core.summary
              .addHeading("📋 Repository Policy Validation Summary", 2)
              .addTable([
                [{ data: "Item", header: true }, { data: "Subject", header: true }, { data: "Status", header: true }, { data: "Details", header: true }],
                ...summaryRows,
              ])
              .write();

            if (warnings.length > 0) {
              for (const w of warnings) {
                core.warning(`[Policy Warning] ${w}`);
              }
            }

            // 5. Hard Fail only on Blocker errors
            if (blockers.length > 0) {
              for (const b of blockers) {
                for (const iss of b.issues) {
                  core.error(`[Policy Blocker] ${b.target}: ${iss}\n  Subject: "${b.text}"`);
                }
              }
              core.setFailed(`Repository policy check failed with ${blockers.length} blocking error(s). Review the Step Summary table above for details.`);
            }
