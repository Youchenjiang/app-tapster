# ==============================================================================
# 🔑 TruffleHog Secrets & Credential Leak Scan (機敏資訊與金鑰洩漏即時防禦)
#
# 【生命週期】
# PR Gate / Security Gate：PR 階段優先攔截可驗證的 Secret 洩漏；主要分支 Push 時再巡檢一次。
#
# 【功能說明】
# 深度掃描 Git Commit 歷史與變更檔案，精準辨識 800+ 種常見 API Keys、私人私鑰 (Private Keys)、
# 資料庫連線字串、雲端憑證 (AWS, GCP, Azure, OpenAI, GitHub Tokens 等)。
#
# 【關鍵特色】
# 啟用 `--only-verified` 參數，僅對「真實有效且經端點驗證成功」的外洩金鑰報警，
# 徹底杜絕假陽性 (False Positives) 雜訊干擾。
#
# 【觸發方式】
# 1. 每次推送到主要分支 (main, master, dev)。
# 2. 針對主要分支發起或更新 Pull Request。
# ==============================================================================

name: Secrets Scan

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

permissions:
  contents: read  # checkout only; no write or package access needed

jobs:
  trufflehog:
    name: TruffleHog Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 完整簽出以利 Git 歷程追蹤

      - name: TruffleHog Scan (Pull Request)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          path: ./
          base: ${{ github.base_ref }}
          head: HEAD
          extra_args: --only-verified

      - name: TruffleHog Scan (Push)
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          path: ./
          extra_args: --only-verified
