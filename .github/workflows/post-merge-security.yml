# ==============================================================================
# 🔐 Post-Merge Staging Security Validation
#
# 【生命週期】
# Post-Merge Security：只在程式進入 main / master 後自動啟動部署層安全驗證。
#
# 【定位】
# 在程式進入 main / master 後執行部署後安全驗證。此 workflow 不取代 PR gate；
# CodeQL、TruffleHog 與 policy 仍應在 PR 階段先執行。
#
# 【啟用條件】
# Repository Variable `STAGING_URL` 有設定時才執行 Web DAST。
# 未配置任何外部平台時，workflow 會安全跳過相對應的 integration。
# ==============================================================================

name: Post-Merge Security

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  staging-readiness:
    name: Check staging readiness
    runs-on: ubuntu-latest
    env:
      STAGING_URL: ${{ vars.STAGING_URL }}

    steps:
      - name: Check staging configuration
        id: config
        shell: bash
        run: |
          if [[ -n "${STAGING_URL:-}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Post-merge DAST skipped. Configure STAGING_URL to enable staging scans."
          fi

      - name: Wait for staging to become reachable
        if: ${{ steps.config.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..20}; do
            if curl --fail --silent --show-error --max-time 15 "${STAGING_URL}" > /dev/null; then
              echo "Staging endpoint is reachable."
              exit 0
            fi

            echo "Staging is not ready yet (attempt ${attempt}/20)."
            sleep 15
          done

          echo "::error::Staging endpoint did not become reachable within 5 minutes."
          exit 1

  zap:
    name: ZAP baseline scan
    needs: staging-readiness
    if: ${{ vars.STAGING_URL != '' && needs.staging-readiness.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ vars.STAGING_URL }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-post-merge
          cmd_options: '-J report_json.json -x report_xml.xml'

  defectdojo-zap:
    name: Send ZAP report to DefectDojo
    needs: zap
    if: ${{ needs.zap.result == 'success' }}
    uses: ./.github/workflows/defectdojo-upload.yml
    with:
      artifact_name: zap-post-merge
      report_path: report_xml.xml
      scan_type: ZAP Scan
      test_title: Post-Merge ZAP Scan
      engagement_name: Post-Merge Security
    secrets: inherit

  faraday-zap:
    name: Send ZAP report to Faraday
    needs: zap
    if: ${{ needs.zap.result == 'success' }}
    uses: ./.github/workflows/faraday-upload.yml
    with:
      artifact_name: zap-post-merge
      report_path: report_xml.xml
    secrets: inherit

  openvas:
    name: Greenbone OpenVAS scan
    needs: staging-readiness
    if: ${{ needs.staging-readiness.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENVAS_HOST: ${{ vars.OPENVAS_HOST }}
      OPENVAS_TASK_ID: ${{ vars.OPENVAS_TASK_ID }}
      OPENVAS_SSH_PORT: ${{ vars.OPENVAS_SSH_PORT }}
      OPENVAS_SSH_USERNAME: ${{ vars.OPENVAS_SSH_USERNAME }}
      OPENVAS_GMP_USERNAME: ${{ secrets.OPENVAS_GMP_USERNAME }}
      OPENVAS_GMP_PASSWORD: ${{ secrets.OPENVAS_GMP_PASSWORD }}
      OPENVAS_SSH_PASSWORD: ${{ secrets.OPENVAS_SSH_PASSWORD }}

    steps:
      - name: Check Greenbone integration settings
        id: config
        shell: bash
        run: |
          if [[ -n "${OPENVAS_HOST:-}" &&
                -n "${OPENVAS_TASK_ID:-}" &&
                -n "${OPENVAS_GMP_USERNAME:-}" &&
                -n "${OPENVAS_GMP_PASSWORD:-}" &&
                -n "${OPENVAS_SSH_PASSWORD:-}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Greenbone scan skipped. Configure OPENVAS_HOST, OPENVAS_TASK_ID and the required credentials to enable it."
          fi

      - name: Install Greenbone gvm-tools
        if: ${{ steps.config.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          pipx install gvm-tools

      - name: Start Greenbone task and wait for completion
        if: ${{ steps.config.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          ssh_port="${OPENVAS_SSH_PORT:-22}"
          ssh_user="${OPENVAS_SSH_USERNAME:-gmp}"

          gvm=(
            gvm-cli
            --timeout 120
            --gmp-username "${OPENVAS_GMP_USERNAME}"
            --gmp-password "${OPENVAS_GMP_PASSWORD}"
            ssh
            --hostname "${OPENVAS_HOST}"
            --port "${ssh_port}"
            --ssh-username "${ssh_user}"
            --ssh-password "${OPENVAS_SSH_PASSWORD}"
            --auto-accept-host
          )

          start_response="$("${gvm[@]}" --xml "<start_task task_id=\"${OPENVAS_TASK_ID}\"/>")"
          report_id="$(
            printf '%s' "${start_response}" |
              python -c 'import sys, xml.etree.ElementTree as ET; root=ET.fromstring(sys.stdin.read()); print(root.findtext("report_id") or "")'
          )"

          if [[ -z "${report_id}" ]]; then
            echo "::error::Greenbone did not return a report ID."
            exit 1
          fi

          echo "Greenbone report ID: ${report_id}"

          completed=false
          for attempt in {1..120}; do
            task_response="$("${gvm[@]}" --xml "<get_tasks task_id=\"${OPENVAS_TASK_ID}\"/>")"
            task_status="$(
              printf '%s' "${task_response}" |
                python -c 'import sys, xml.etree.ElementTree as ET; root=ET.fromstring(sys.stdin.read()); print(root.findtext(".//task/status") or "")'
            )"

            echo "Greenbone task status: ${task_status:-unknown} (poll ${attempt}/120)"

            case "${task_status}" in
              Done)
                completed=true
                break
                ;;
              Stopped|Interrupted|"Internal Error")
                echo "::error::Greenbone task ended with status: ${task_status}"
                exit 1
                ;;
            esac

            sleep 30
          done

          if [[ "${completed}" != "true" ]]; then
            echo "::error::Greenbone task did not finish within 60 minutes."
            exit 1
          fi

          "${gvm[@]}" --raw --xml "<get_reports report_id=\"${report_id}\" details=\"1\" ignore_pagination=\"1\"/>" |
            python -c 'import sys, xml.etree.ElementTree as ET; root=ET.fromstring(sys.stdin.read()); report=root.find(".//report"); assert report is not None, "report element missing"; sys.stdout.write(ET.tostring(report, encoding="unicode"))' > openvas-report.xml

      - name: Upload Greenbone report artifact
        if: ${{ steps.config.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: openvas-post-merge
          path: openvas-report.xml
          if-no-files-found: error
          retention-days: 30

  defectdojo-openvas:
    name: Send OpenVAS report to DefectDojo
    needs: openvas
    if: ${{ needs.openvas.result == 'success' }}
    uses: ./.github/workflows/defectdojo-upload.yml
    with:
      artifact_name: openvas-post-merge
      report_path: openvas-report.xml
      scan_type: OpenVAS Parser v2
      test_title: Post-Merge OpenVAS Scan
      engagement_name: Post-Merge Security
    secrets: inherit

  faraday-openvas:
    name: Send OpenVAS report to Faraday
    needs: openvas
    if: ${{ needs.openvas.result == 'success' }}
    uses: ./.github/workflows/faraday-upload.yml
    with:
      artifact_name: openvas-post-merge
      report_path: openvas-report.xml
    secrets: inherit

  wazuh-health:
    name: Verify Wazuh runtime monitoring
    needs: staging-readiness
    if: ${{ needs.staging-readiness.result == 'success' }}
    uses: ./.github/workflows/wazuh-health.yml
    secrets: inherit
